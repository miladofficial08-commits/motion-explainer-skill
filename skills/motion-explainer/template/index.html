<!doctype html>
<html lang="en" data-resolution="portrait">
<head>
<meta charset="UTF-8" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; background: #06050c; font-family: Inter, sans-serif; color: #f4f2ff; }
  #glow { position: absolute; left: -200px; top: 380px; width: 1480px; height: 1200px; border-radius: 50%; background: radial-gradient(circle, rgba(124,92,255,.34) 0%, rgba(124,92,255,.1) 40%, rgba(124,92,255,0) 68%); }
  .scene { position: absolute; inset: 0; }
  .cap { position: absolute; left: 80px; right: 80px; top: 330px; text-align: center; font-weight: 900; font-size: 84px; line-height: 1.08; letter-spacing: .01em; text-transform: uppercase; }
  .cap span { display: inline-block; margin: 0 9px; }
  .cap .hot { color: #9d7bff; }
  .tag { position: absolute; left: 390px; width: 300px; top: 236px; height: 54px; line-height: 50px; border: 2px solid rgba(255,255,255,.55); border-radius: 999px; text-align: center; font-weight: 700; font-size: 24px; letter-spacing: .2em; text-transform: uppercase; color: rgba(255,255,255,.8); }
  /* pictogram person: head + body */
  .p { position: absolute; width: 120px; height: 190px; }
  .p::before { content: ""; position: absolute; left: 32px; top: 0; width: 56px; height: 56px; border-radius: 50%; background: #f4f2ff; }
  .p::after { content: ""; position: absolute; left: 12px; top: 66px; width: 96px; height: 124px; border-radius: 30px 30px 10px 10px; background: #f4f2ff; }
  .p.v::before, .p.v::after { background: #8f6bff; }
  .p.dim::before, .p.dim::after { background: rgba(244,242,255,.5); }
  .desk { position: absolute; height: 8px; border-radius: 4px; background: rgba(244,242,255,.85); }
  .floor { position: absolute; left: 110px; right: 110px; height: 4px; border-radius: 2px; background: rgba(244,242,255,.5); }
  svg { position: absolute; overflow: visible; }
  .ln { fill: none; stroke: #f4f2ff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .ln.v { stroke: #9d7bff; }
  .badge { position: absolute; padding: 12px 26px; border-radius: 14px; border: 3px solid #ff5a6e; color: #ff5a6e; font-weight: 900; font-size: 36px; letter-spacing: .12em; text-transform: uppercase; }
  .bar { position: absolute; bottom: 690px; width: 170px; border-radius: 18px 18px 0 0; background: #f4f2ff; transform-origin: 50% 100%; }
  .bar.v { background: linear-gradient(180deg, #b79dff, #7c5cff); }
  .lab { position: absolute; width: 260px; text-align: center; font-weight: 700; font-size: 32px; color: rgba(244,242,255,.75); }
  .big { position: absolute; left: 0; right: 0; text-align: center; font-weight: 900; font-size: 190px; letter-spacing: -.04em; color: #9d7bff; }
  .srcl { position: absolute; left: 0; right: 0; text-align: center; font-size: 28px; color: rgba(244,242,255,.5); }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="9.2" data-width="1080" data-height="1920">
  <div id="glow"></div>

  <div id="s1" class="clip scene" data-start="0" data-duration="2.5" data-track-index="1" data-track-kind="graphics">
    <div class="tag" id="s1-tag">New story</div>
    <div class="cap" id="s1-cap"><span id="a0">The</span><span id="a1">kid</span><span id="a2">who</span><span id="a3" class="hot">doodles</span><span id="a4">in</span><span id="a5">class</span></div>
    <div class="p dim" style="left:120px;top:880px" id="k0"></div>
    <div class="p" style="left:300px;top:880px" id="k1"></div>
    <div class="p v" style="left:480px;top:880px" id="k2"></div>
    <div class="p" style="left:660px;top:880px" id="k3"></div>
    <div class="p dim" style="left:840px;top:880px" id="k4"></div>
    <div class="desk" style="left:100px;width:880px;top:1010px"></div>
    <svg style="left:440px;top:700px" width="220" height="160" viewBox="0 0 220 160"><path id="s1-doodle" class="ln v" d="M10 120 C40 20 70 150 100 60 S150 10 170 90 S200 130 210 40"/></svg>
  </div>

  <div id="s2" class="clip scene" data-start="2.5" data-duration="2.0" data-track-index="2" data-track-kind="graphics">
    <div class="cap" id="s2-cap"><span id="b0">isn&rsquo;t</span><span id="b1" class="hot">zoning</span><span id="b2" class="hot">out.</span></div>
    <div class="p v" style="left:480px;top:880px" id="h2"></div>
    <div class="floor" style="top:1074px"></div>
    <svg style="left:620px;top:720px" width="260" height="180" viewBox="0 0 260 180"><path id="s2-cloud" class="ln" d="M40 130 C0 130 0 80 40 80 C40 30 110 20 130 60 C170 30 230 60 210 100 C250 110 240 150 200 150 L60 150 C50 150 40 140 40 130 Z"/></svg>
    <div class="badge" style="left:650px;top:930px" id="s2-badge">Not this</div>
  </div>

  <div id="s3" class="clip scene" data-start="4.5" data-duration="2.6" data-track-index="1" data-track-kind="graphics">
    <div class="cap" id="s3-cap"><span id="c0">Doodlers</span><span id="c1">recalled</span><span id="c2" class="hot">29%</span><span id="c3" class="hot">more.</span></div>
    <div class="bar" style="left:300px;height:240px" id="s3-b1"></div>
    <div class="bar v" style="left:610px;height:420px" id="s3-b2"></div>
    <div class="floor" style="top:1230px"></div>
    <div class="lab" style="left:255px;top:1250px">no doodling</div>
    <div class="lab" style="left:565px;top:1250px">doodling</div>
    <div class="big" style="top:640px;font-size:150px" id="s3-n">+0%</div>
    <div class="srcl" style="top:1330px">Andrade, Applied Cognitive Psychology, 2009</div>
  </div>

  <div id="s4" class="clip scene" data-start="7.1" data-duration="2.1" data-track-index="2" data-track-kind="graphics">
    <div class="cap" id="s4-cap"><span id="d0">The</span><span id="d1" class="hot">pen</span><span id="d2">keeps</span><span id="d3">the</span><span id="d4">brain</span><span id="d5" class="hot">awake.</span></div>
    <div class="p v" style="left:200px;top:900px" id="h4"></div>
    <svg style="left:330px;top:820px" width="560" height="320" viewBox="0 0 560 320">
      <path id="s4-wave" class="ln v" d="M10 200 C60 80 110 300 160 180 S260 60 310 170 S380 250 410 160"/>
      <path id="s4-brain" class="ln" d="M470 90 C430 90 410 130 430 160 C405 185 425 235 470 230 L470 90 M470 90 C510 90 530 130 510 160 C535 185 515 235 470 230"/>
    </svg>
    <div class="floor" style="top:1094px"></div>
  </div>
</div>
<script>
  window.__timelines = window.__timelines || {};
  const tl = gsap.timeline({ paused: true });
  const word = (id, at) => tl.fromTo(id, { opacity: 0, y: 14, filter: "blur(6px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: 0.14, ease: "power3.out" }, at);
  const draw = (id, at, d) => { const el = document.querySelector(id), n = el.getTotalLength(); tl.fromTo(id, { strokeDasharray: n, strokeDashoffset: n }, { strokeDashoffset: 0, duration: d, ease: "power1.inOut" }, at); };
  tl.fromTo("#glow", { scale: 1, x: -40 }, { scale: 1.18, x: 60, duration: 9.2, ease: "none" }, 0);
  // s1
  ["#a0", "#a1", "#a2", "#a3", "#a4", "#a5"].forEach((w, i) => word(w, i === 0 ? 0 : 0.12 + i * 0.22));
  tl.fromTo("#a0", { opacity: 1 }, { opacity: 1, duration: 0.01 }, 0);
  ["#k0", "#k1", "#k3", "#k4"].forEach((k, i) => tl.fromTo(k, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.25, ease: "back.out(1.6)" }, 0.25 + i * 0.09));
  tl.fromTo("#k2", { scale: 1.12 }, { scale: 1, duration: 0.4, ease: "power3.out" }, 0);
  draw("#s1-doodle", 0.8, 1.2);
  tl.fromTo("#k2", { rotation: 0 }, { rotation: 4, duration: 0.18, ease: "sine.inOut", yoyo: true, repeat: 5, transformOrigin: "50% 100%" }, 0.9);
  // s2
  ["#b0", "#b1", "#b2"].forEach((w, i) => word(w, 2.5 + i * 0.24));
  tl.fromTo("#h2", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(1.6)" }, 2.5);
  draw("#s2-cloud", 2.6, 0.7);
  tl.fromTo("#s2-badge", { opacity: 0, scale: 1.6, rotation: -8 }, { opacity: 1, scale: 1, rotation: -4, duration: 0.16, ease: "power4.out" }, 3.35);
  tl.to("#s2-cloud", { opacity: 0.25, duration: 0.2 }, 3.4);
  // s3
  ["#c0", "#c1", "#c2", "#c3"].forEach((w, i) => word(w, 4.5 + i * 0.26));
  tl.fromTo("#s3-b1", { scaleY: 0 }, { scaleY: 1, duration: 0.45, ease: "power3.out" }, 4.65);
  tl.fromTo("#s3-b2", { scaleY: 0 }, { scaleY: 1, duration: 0.7, ease: "power3.out" }, 4.95);
  const o = { v: 0 }, nEl = document.getElementById("s3-n");
  tl.to(o, { v: 29, duration: 0.6, ease: "power1.in", onUpdate: () => { nEl.textContent = "+" + Math.round(o.v) + "%"; } }, 4.95);
  tl.fromTo("#s3-n", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.2, ease: "power3.out" }, 4.9);
  tl.fromTo("#s3-n", { scale: 1 }, { scale: 1.14, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out", immediateRender: false }, 5.56);
  // s4
  ["#d0", "#d1", "#d2", "#d3", "#d4", "#d5"].forEach((w, i) => word(w, 7.1 + i * 0.18));
  tl.fromTo("#h4", { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.25, ease: "power3.out" }, 7.1);
  draw("#s4-wave", 7.3, 0.8);
  draw("#s4-brain", 7.9, 0.6);
  tl.fromTo("#s4-brain", { stroke: "#f4f2ff" }, { stroke: "#9d7bff", duration: 0.3 }, 8.5);
  tl.to({}, { duration: 0.01 }, 9.19);
  window.__timelines["main"] = tl;
</script>
</body>
</html>
